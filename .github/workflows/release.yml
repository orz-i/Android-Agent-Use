name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Build Standalone Server Jar & AARs
        run: |
          ./gradlew assembleRelease
          ./gradlew packageServerDex

      - name: Collect Release Assets
        run: |
          mkdir -p dist
          find . -name "*.aar" -exec cp {} dist/ \;
          find . -name "agent-display-server.jar" -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.aar
            dist/*.jar
